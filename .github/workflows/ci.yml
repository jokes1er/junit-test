on: [push, pull_request]

jobs:
  runs-on: ubuntu-latest

  steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: ''
      java-version: '21'
      distribution: 'temurin'


    - name: Build with Maven
      run: mvn -B test